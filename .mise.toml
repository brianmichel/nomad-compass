[env]
PATH = "{{env.PATH}}"
# Load env from the dotenv file after tools have defined environment variables
_.file = { path = ".env", tools = true }

[tools]
go = "1.24.8"
node = "20"

[tasks.go-test]
run = "go test ./... -v"

[tasks.coverage]
description = "Run Go tests and print package and total coverage"
run = "mkdir -p .tmp && go test ./... -coverprofile=.tmp/coverage.out && go tool cover -func=.tmp/coverage.out | tail -1"

[tasks.frontend-install]
dir = "frontend"
run = "npm install"

[tasks.frontend-build]
dir = "frontend"
run = "npm run build"
depends = ["frontend-install"]

[tasks.frontend-dev]
dir = "frontend"
run = "npm run dev"
depends = ["frontend-install"]

[tasks.backend-dev]
run = "go run ./cmd/nomad-compass"

[tasks.e2e-local]
description = "Run Compass against an isolated local Nomad agent using Lima Docker"
run = "./scripts/e2e-local.sh"
